name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 与本机 vcpkg 对齐。上游一旦更新 SFML / ImGui-SFML 的 port，这里可能在没有改代码的情况下编不过，
  # 钉住 commit 才能让 CI 变红等价于代码有问题
  VCPKG_COMMIT: 82e69bce83f53191d728414ac24922e8496e34c4
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build xvfb libgl1-mesa-dri python3-pil ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxext-dev libxrender-dev \
            libgl1-mesa-dev libudev-dev libasound2-dev

      # 只缓存二进制包，别缓存 vcpkg/installed：恢复缓存会把 vcpkg/ 目录建出来，
      # 紧接着的 git clone 就会撞上「destination path already exists」
      - name: 恢复 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-linux-${{ env.VCPKG_COMMIT }}

      - name: 装 vcpkg 与依赖
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          # ffmpeg 用发行版的 libav*-dev：CMakeLists 里 find_package(FFMPEG) 找不到会回退 pkg-config，
          # 这样能省掉 vcpkg 从源码编 ffmpeg 的那几十分钟
          ./vcpkg/vcpkg install sfml imgui-sfml cxxopts nlohmann-json "glad[loader]" \
            --triplet x64-linux

      - name: 配置与构建
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --parallel

      # 离屏模式也要真实的 GL 上下文（sf::Context 走 GLX），无头机器上得靠 Xvfb + Mesa 软件渲染
      - name: 跑测试
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            python3 tests/run_tests.py --exe build/ShadertoyEmulator

      # 存/取拆开是为了让保存无条件执行。默认的缓存 action 只在 job 成功时才存，
      # 会变成「测试挂了 → 缓存没存 → 下次又把 ffmpeg 从头编一遍」的死循环
      - name: 保存 vcpkg 二进制缓存
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-linux-${{ env.VCPKG_COMMIT }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # 同 linux：只缓存二进制包，缓存 vcpkg/installed 会把 vcpkg/ 目录占住
      - name: 恢复 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-windows-${{ env.VCPKG_COMMIT }}

      - name: 装 vcpkg 与依赖
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg
          git -C vcpkg checkout "$env:VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          # 只装 x264：测试的视频用例只要求 H.264，AAC 是 ffmpeg 自带的。
          # 本机那套六个 feature 会让首次构建再多个几十分钟
          ./vcpkg/vcpkg install sfml imgui-sfml cxxopts nlohmann-json "glad[loader]" "ffmpeg[x264]" `
            --triplet x64-windows

      - name: 配置与构建
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel

      - name: 检查依赖 DLL 是否齐全
        shell: pwsh
        run: |
          # 加载 DLL 时本来就优先 exe 同目录，所以这里用的就是 vcpkg applocal 拷到
          # exe 旁边的那份。缺哪个立刻就会炸，别等到用户下载了才发现
          & ./build/Release/ShadertoyEmulator.exe --help > $null
          if ($LASTEXITCODE -ne 0) { throw "exe 起不来，依赖 DLL 不全" }

      # Windows 这边不跑那 11 个用例：runner 没有 GPU，Mesa 只能落到软件后端，
      # 那里的行为和真实环境差很远，报出来的失败跟代码无关。用例逻辑由 linux job 覆盖
      # 每次构建都打一份：打包这步本身也得被验证，不然要等第一次发 tag 才发现它坏了。
      # always() 是为了测试挂了也能把产物传上去——那份二进制才复现得出问题
      - name: 打包
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/ShadertoyEmulator.exe dist/
          # vcpkg 的 applocal 把递归依赖的 DLL 全拷到了 exe 旁边，取这一份就够。
          # 别图省事整个拷 vcpkg 的 bin 目录：那是所有已装包的 DLL，1.8GB
          if (-not (Get-ChildItem build/Release/*.dll -ErrorAction SilentlyContinue)) {
            throw "applocal 没把依赖 DLL 放到 build/Release/，这样打出来的包会缺 DLL"
          }
          Copy-Item build/Release/*.dll dist/
          # MSVC 运行时不在 vcpkg 里，目标机器没装 VC++ Redistributable 时缺了它照样起不来
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $crtDlls = & $vswhere -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll" 2>$null
          if ($crtDlls) { Copy-Item $crtDlls dist/ }
          else { Write-Warning "没找到 MSVC 运行时 DLL，目标机器需要自行安装 VC++ Redistributable" }
          # 就地跑一次：缺哪个 DLL 这里就会炸，别把跑不起来的包发出去
          & ./dist/ShadertoyEmulator.exe --help > $null
          if ($LASTEXITCODE -ne 0) { throw "打包出来的 exe 跑不起来" }
          Copy-Item -Recurse shaders dist/shaders
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "ShadertoyEmulator-${{ github.ref_name }}-win64.zip"

      # Actions 里也能下，但下载要登录 GitHub 账号；免登录的正式下载走下面的 Release
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadertoyEmulator-win64
          path: ShadertoyEmulator-*-win64.zip

      # 必须 success()：不加的话光看 tag 就会发，测试没过的包也会挂到 Release 上
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: ShadertoyEmulator-*-win64.zip

      # 同 linux：无条件保存，否则 Windows job 一失败，ffmpeg 就得永远重编
      - name: 保存 vcpkg 二进制缓存
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-windows-${{ env.VCPKG_COMMIT }}
